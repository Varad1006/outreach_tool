{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:760px">
  <h2>Import leads</h2>
  <p class="small muted">Reads the <b>Dubai Real Estate</b> and <b>Law Firms</b> tabs (and any other tab with Company + Email columns).
  Re-importing updates lead details but keeps your statuses, notes and email history.</p>
  <form method="post" enctype="multipart/form-data">
    <label>Upload .xlsx</label><input type="file" name="file" accept=".xlsx">
    <p class="muted small" style="text-align:center">— or —</p>
    <label>Google Sheets link (sharing must be "Anyone with the link can view")</label>
    <input type="url" name="sheet_url" value="{{ s.get('sheet_url','') }}" placeholder="https://docs.google.com/spreadsheets/d/…">
    <div style="margin-top:12px"><button class="primary">Import</button></div>
  </form>
</div>
{% endblock %}
